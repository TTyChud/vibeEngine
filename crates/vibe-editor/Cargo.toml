[package]
name = "vibe-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The vibeEngine editor: an egui frontend, panels and camera controllers"

[dependencies]
egui = "0.36"
egui-winit = "0.36"
glam.workspace = true
log.workspace = true
thiserror.workspace = true
vibe-audio.workspace = true
vibe-ecs.workspace = true
vibe-gltf.workspace = true
vibe-math.workspace = true
vibe-render.workspace = true
vibe-rhi.workspace = true
vibe-scene.workspace = true

[dev-dependencies]
# The editor holds no Vulkan objects, so the example that proves the UI renders
# on a real driver brings its own unsafe dependencies. Putting them here rather
# than in the library is what keeps the crate itself free of unsafe code.
ash.workspace = true
bytemuck.workspace = true
vibe-frame.workspace = true
vibe-shader.workspace = true
vibe-vk.workspace = true
vibe-window.workspace = true
winit = "0.30"

[lints.rust]
# The library is free of unsafe code; its examples are the hardware
# verification and necessarily drive Vulkan directly, which is the one thing
# the editor itself refuses to do.
unsafe_code = "allow"
